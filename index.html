<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket League KPH Tracker</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    margin:20px;
}

h1{
    margin-bottom:5px;
}

#count{
    margin-bottom:20px;
    font-size:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(55px,1fr));
    gap:8px;
    max-width:1100px;
    margin:auto;
}

.kph{
    background:#2b2b2b;
    border:2px solid #555;
    border-radius:8px;
    padding:12px 0;
    cursor:pointer;
    user-select:none;
    transition:.15s;
    font-weight:bold;
}

.kph:hover{
    transform:scale(1.05);
}

.done{
    background:#2ecc71;
    border-color:#2ecc71;
    color:white;
}

button{
    margin-top:20px;
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Rocket League KPH Tracker</h1>
<div id="count">0 / 217 Complete</div>

<div class="grid" id="grid"></div>

<button onclick="resetProgress()">Reset Progress</button>

<script>
const TOTAL = 217;
const STORAGE = "rl_kph_tracker";

let completed = JSON.parse(localStorage.getItem(STORAGE)) || [];

const grid = document.getElementById("grid");

function updateCount(){
    document.getElementById("count").textContent =
        completed.length + " / " + TOTAL + " Complete";
}

for(let i=0;i<=216;i++){

    const box=document.createElement("div");
    box.className="kph";
    box.textContent=i;

    if(completed.includes(i)){
        box.classList.add("done");
    }

    box.onclick=()=>{
        if(completed.includes(i)){
            completed=completed.filter(x=>x!==i);
            box.classList.remove("done");
        }else{
            completed.push(i);
            completed.sort((a,b)=>a-b);
            box.classList.add("done");
        }

        localStorage.setItem(STORAGE,JSON.stringify(completed));
        updateCount();
    };

    grid.appendChild(box);
}

updateCount();

function resetProgress(){
    if(confirm("Reset all progress?")){
        completed=[];
        localStorage.removeItem(STORAGE);
        document.querySelectorAll(".kph").forEach(x=>x.classList.remove("done"));
        updateCount();
    }
}
</script>

</body>
</html>
