<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket League KPH Challenge</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
}

/* LEFT PROGRESS BAR */
#leftPanel {
    width: 90px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    border-right: 2px solid #333;
    position: relative;
    padding-bottom: 10px;
}

#percent {
    position: absolute;
    top: 10px;
    font-size: 18px;
    font-weight: bold;
}

#barContainer {
    width: 30px;
    height: 80%;
    background: #222;
    border-radius: 10px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
}

#barFill {
    width: 100%;
    height: 0%;
    background: #2ecc71;
    transition: height 0.15s ease;
}

/* MAIN */
#main {
    flex: 1;
    padding: 20px;
    text-align: center;
}

h1 {
    margin-top: 10px;
}

/* CONTROLS */
.controls {
    margin: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
}

input {
    padding: 10px;
    font-size: 16px;
    width: 160px;
    text-align: center;
}

button {
    padding: 10px 12px;
    font-size: 16px;
    cursor: pointer;
    background: #2ecc71;
    border: none;
    color: white;
    border-radius: 6px;
}

button:active {
    transform: scale(0.95);
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 8px;
    max-width: 900px;
    margin: auto;
}

.kph {
    background: #2b2b2b;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 12px 0;
    cursor: pointer;
    user-select: none;
    font-weight: bold;
    transition: transform 0.08s ease;
}

.kph:hover {
    transform: scale(1.05);
}

.done {
    background: #2ecc71;
    border-color: #2ecc71;
}

/* click animation */
.pop {
    animation: pop 0.12s ease;
}

@keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div id="leftPanel">
    <div id="percent">0%</div>
    <div id="barContainer">
        <div id="barFill"></div>
    </div>
</div>

<div id="main">
    <h1>Rocket League KPH Challenge</h1>

    <!-- NEW + / - CONTROLS -->
    <div class="controls">
        <button onclick="changeMax(-10)">−</button>

        <input id="maxKph" type="number" value="100">

        <button onclick="changeMax(10)">+</button>

        <button onclick="generate()">Generate</button>
    </div>

    <div class="grid" id="grid"></div>
</div>

<script>
let completed = JSON.parse(localStorage.getItem("kph")) || [];
let max = 0;

function changeMax(amount) {
    const input = document.getElementById("maxKph");
    let value = parseInt(input.value) || 0;

    value += amount;
    if (value < 0) value = 0;
    if (value > 2000) value = 2000;

    input.value = value;
}

function sound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();

    o.type = "sine";
    o.frequency.setValueAtTime(200, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);

    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

    o.connect(g);
    g.connect(ctx.destination);

    o.start();
    o.stop(ctx.currentTime + 0.15);
}

function update() {
    let total = max + 1;
    let percent = total ? Math.round((completed.length / total) * 100) : 0;

    document.getElementById("percent").innerText = percent + "%";
    document.getElementById("barFill").style.height = percent + "%";
}

function generate() {
    max = parseInt(document.getElementById("maxKph").value);
    if (isNaN(max)) return;

    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    for (let i = 0; i <= max; i++) {
        let box = document.createElement("div");
        box.className = "kph";
        box.innerText = i;

        if (completed.includes(i)) box.classList.add("done");

        box.onclick = () => {
            box.classList.add("pop");
            setTimeout(() => box.classList.remove("pop"), 120);

            if (completed.includes(i)) {
                completed = completed.filter(x => x !== i);
                box.classList.remove("done");
            } else {
                completed.push(i);
                box.classList.add("done");
                sound();
            }

            localStorage.setItem("kph", JSON.stringify(completed));
            update();
        };

        grid.appendChild(box);
    }

    update();
}
</script>

</body>
</html>
